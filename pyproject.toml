[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grian"
version = "0.1.0"
description = "NEM electricity price forecasting and battery-dispatch simulation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "pyarrow>=14,<19",
    "matplotlib>=3.8,<4",
    "pyyaml>=6.0,<7",
    "nemosis>=3.2,<4",
    "pvlib>=0.11,<1",
    "cdsapi>=0.7,<1",
    "xarray>=2024.1",
    "netcdf4>=1.6",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.2,<5",
    "statsmodels>=0.14,<1",
    "torch>=2.2,<3",
    "cvxpy>=1.4,<2",
    "geopandas>=1.0,<2",
    "shapely>=2.0,<3",
    # Typed configs/params, CLIs, and readable output.
    "pydantic>=2.6,<3",
    "fire>=0.6,<1",
    "rich>=13,<15",
    # Modern, extensible hyperparameter optimisation (TPE / GP / grid / random).
    "optuna>=3.6,<5",
]

[project.scripts]
grian = "grian.cli:main"

[project.optional-dependencies]
nemseer = ["nemseer>=0.6"]
dashboard = ["plotly>=5.20,<7"]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/grian"]
artifacts = ["src/grian/assets/*.html"]

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
]
ignore = [
    "D100",  # module docstring (we use __init__ for package docs)
    "D104",  # missing docstring in public package
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test files: docstrings not required, and long assert lines are acceptable.
"tests/*" = ["D", "E501"]

# Type-checking is enforced on the models package (where the contract functions
# carry full annotations). The dispatch/evaluation modules use numpy-heavy
# dynamic patterns that mypy flags without real bugs; widening the scope is a
# separate, deliberate follow-up rather than a blanket ignore.
[tool.mypy]
python_version = "3.11"
files = ["src/grian/models"]
ignore_missing_imports = true    # numpy/pandas/sklearn/lightgbm/torch/cvxpy: no/partial stubs
check_untyped_defs = false       # check the types we added; don't force full coverage
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
